<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>
  <link rel="stylesheet" href="cadastro.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <div class="box">
    <h1>CADASTRE-SE</h1>
    <p></p>

    
    <form id="form">
      <div class="inputbox">
        <input type="text" name="nome" id="nome" class="inputUser" required>
        <label for="nome" class="labelinput">Nome completo</label>
      </div>

      <br>
      <div class="inputbox">
        <input type="text" name="email" id="email" class="inputUser" required>
        <label for="email" class="labelinput">Email</label>
        <small id="textEmail"></small>
      </div>

      <br>
      <div class="inputbox">
        <input type="password" name="senha" id="senha" class="inputUser" required>
        <label for="senha" class="labelinput">Senha</label>
        <small id="passwordsenha"></small>
      </div>

      <br>
      <div class="inputbox">
        <input type="tel" name="telefone" id="telefone" class="inputUser" required>
        <label for="telefone" class="labelinput">Telefone</label>
      </div>

      <br>
      <p>Sexo:</p>
      <input type="radio" id="feminino" name="genero" value="feminino" required>
      <label for="feminino">Feminino</label><br>
      <input type="radio" id="masculino" name="genero" value="masculino" required>
      <label for="masculino">Masculino</label><br>
      <input type="radio" id="outros" name="genero" value="outros" required>
      <label for="outros">Outros</label><br>

      <br>
      <label for="data_nascimento"><b>Data de nascimento:</b></label>
      <input type="date" name="data_nascimento" id="data_nascimento" required>

      <br><br>
     
      <input type="submit" value="Cadastrar" id="submit">
      <p>tem uma conta <a href="/login/login.html">Clique aqui</a>.</p>
    </form>
  </div>

  
  <script type="module" src="/cadastro/cadastro.js"></script>
</body>
</html>
