<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div class="login-form">
        <h1>Faça seu login</h1>

       
        <form id="loginForm">
            <input type="email" id="emailLogin" placeholder="Email" required>
            <input type="password" id="senhaLogin" placeholder="Senha" required>

            <input type="submit" value="Entrar" id="submitLogin">

            
           <button id="btnEsqueceuSenha" type="button" class="esqueceu-senha-btn">
  Esqueceu sua senha?
</button>

            
            <p id="feedbackMessage"></p>
            <p id="msgReset"></p>
        </form>

        <p>Não possui uma conta? <a href="/cadastro/cadastr.html">Crie uma aqui</a>.</p>
    </div>

  
    <script type="module" src="/login/login.js"></script>
    <script type="module" src="/cadastro/firebase-init.js"></script>
</body>
</html>
